services:
  rc-park-weather-forcaster:
    build:
      context: .
      dockerfile: Dockerfile
    image: rc-park-weather-forcaster:latest
    environment:
      # Override any setting using double-underscore notation for nested keys
      - Location__Name=Mary Cummings Park, Burlington MA
      - Location__Latitude=42.4936
      - Location__Longitude=-71.1967
      # Uncomment and adjust as needed:
      # - Thresholds__MaxWindSpeedMph=15
      # - Thresholds__MaxGustMph=20
      # - ForecastHours=48
